[package]
name = "pdf-tormentosa"
version = "0.1.0"
description = "A minimalist PDF reader"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pdf_tormentosa_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
tauri-plugin-persisted-scope = "2"
tauri-plugin-opener = "2"
# Decodes the save destination, sent percent-encoded in an IPC header.
percent-encoding = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "linux")'.dependencies]
# async-io backend (not tokio): with tokio, zbus switches its blocking API to a private
# tokio runtime, which panics when tauri-plugin-opener calls it from an async command.
ashpd = { version = "0.13.13", default-features = false, features = ["async-io", "open_uri", "print"] }

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-android-print = { path = "plugins/android-print" }
